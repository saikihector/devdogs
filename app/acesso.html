<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acessar Conta SCRUM</title>
    <link rel="stylesheet" href="css/acesso.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>
<body>
    <div class="container" id="container">

        <!-- Cadastro -->
        <div class="form-container sign-up">
            <form id="signupForm" method="post">
                <h1>Criar Conta</h1>
                <input type="text" name="nome" placeholder="Nome" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="text" name="cpf" placeholder="CPF" required>
                <input type="password" name="senha" placeholder="Senha" required>
                <button type="submit">Cadastrar</button>
            </form>
        </div>

        <!-- Login -->
        <div class="form-container sign-in">
            <form id="loginForm" method="post">
                <h1>Entrar na Conta</h1>
                <input type="text" name="cpf" placeholder="CPF" required>
                <input type="password" name="senha" placeholder="Senha" required>
                <a href="esqueci-senha.html" class="forgot">Esqueci Minha Senha</a>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- Painel de alternância -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Bem-vindo de volta!</h1>
                    <p>Entre com seus dados para acessar todo o conteúdo</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Olá! Seja bem-vindo!</h1>
                    <p>Registre seus dados para acessar todo o conteúdo</p>
                    <button class="hidden" id="register">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <a href="index.html">Voltar só por voltar mesmo</a>
    <script src="js/acesso.js"></script>
</body>
</html>
