<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Resultado da sua avaliação de metodologias ágeis.">
    <title>Resultado da avaliação | Dog School</title>
    <link rel="stylesheet" href="src/css/resultado.css">
</head>
<body>
    <header class="cabecalho">
        <a class="logo" href="index.html" aria-label="Dog School - página inicial">
            <span class="logo-simbolo" aria-hidden="true">▰▰</span>
            <span class="logo-dog">Dog</span><span>School</span>
        </a>
    </header>

    <main class="pagina-resultado">
        <section class="cartao-resultado" aria-labelledby="titulo-resultado">
            <div class="sobretitulo">
                <span class="medalha" aria-hidden="true">✓</span>
                <span>AVALIAÇÃO CONCLUÍDA</span>
            </div>

            <h1 id="titulo-resultado">Seu resultado</h1>
            <p class="descricao">Confira seu desempenho nesta tentativa.</p>

            <div class="resultado-principal">
                <div
                    class="grafico-aproveitamento"
                    role="img"
                    aria-label="Aproveitamento: 66,67 por cento"
                    style="--percentual: 66.67%"
                >
                    <div class="grafico-centro">
                        <span class="icone-capelo" aria-hidden="true">✦</span>
                        <strong id="percentual">66,67%</strong>
                        <span>Aproveitamento</span>
                    </div>
                </div>

                <div class="situacao-container">
                    <div
                        class="situacao resultado-aprovado"
                        id="situacao"
                        role="status"
                        aria-live="polite"
                    >
                        <span class="indicador" aria-hidden="true">✓</span>
                        <span id="texto-situacao">Aprovado</span>
                    </div>

                    <p class="mensagem" id="mensagem-resultado">
                        Parabéns! Você alcançou o aproveitamento necessário.
                    </p>
                </div>
            </div>

            <div class="resumo" aria-label="Resumo do resultado">
                <div class="dado dado-acertos">
                    <span class="dado-icone" aria-hidden="true">◎</span>
                    <span class="dado-conteudo">
                        <strong class="dado-valor" id="acertos">8</strong>
                        <span class="dado-rotulo">Acertos</span>
                    </span>
                </div>

                <div class="dado dado-erros">
                    <span class="dado-icone" aria-hidden="true">×</span>
                    <span class="dado-conteudo">
                        <strong class="dado-valor" id="erros">4</strong>
                        <span class="dado-rotulo">Erros</span>
                    </span>
                </div>

                <div class="dado dado-questoes">
                    <span class="dado-icone" aria-hidden="true">▤</span>
                    <span class="dado-conteudo">
                        <strong class="dado-valor" id="total-questoes">12</strong>
                        <span class="dado-rotulo">Questões</span>
                    </span>
                </div>
            </div>

            <div class="acoes">
                <a class="botao botao-contorno" href="avaliacao.html">
                    <span aria-hidden="true">↻</span>
                    Refazer avaliação
                </a>
                <a class="botao botao-principal" href="index.html">
                    <span aria-hidden="true">⌂</span>
                    Voltar ao início
                </a>
            </div>
        </section>
    </main>

    <canvas id="confetes" aria-hidden="true"></canvas>
    <script src="src/js/resultado.js"></script>
</body>
</html>
